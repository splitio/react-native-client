pipeline:
  name: react-native-client-repo
  identifier: reactnativeclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: react-native-client
        build:
          type: branch
          spec:
            branch: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Node
                  identifier: Install_Node
                  spec:
                    shell: Bash
                    command: |-
                      curl https://mise.run | sh
                      export PATH="$HOME/.local/bin:$PATH"
                      mise use --global node@<+matrix.nodeVersion>
                      node --version
                      npm --version
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm ci
              - step:
                  type: Run
                  name: Check
                  identifier: Check
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm run check
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm run test -- --coverage --coverageReporters=lcov
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: "coverage/lcov.info"
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/node_modules/**,**/dist/**,**/build/**,**/*.spec.js,**/*.spec.ts,**/*.spec.tsx,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/__tests__/**"
              - step:
                  type: Run
                  name: Build
                  identifier: Build
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm run build
        strategy:
          matrix:
            nodeVersion:
              - "lts"
